<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Intelligence Platform</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --line:#e2e2e2;
          --ok:#1a7f37; --warn:#b45309; --bad:#b91c1c; --card:#fafafa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --mut:#999; --line:#333; --card:#1a1a1a; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.6 system-ui,sans-serif; background:var(--bg);
         color:var(--fg); }
  main { max-width:820px; margin:0 auto; padding:1.5rem }
  h1 { font-size:1.2rem; margin:0 } h2 { font-size:.8rem; margin:2rem 0 .5rem;
       text-transform:uppercase; letter-spacing:.05em; color:var(--mut) }
  .principle { color:var(--mut); font-style:italic; margin:.2rem 0 1.5rem }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:8px; padding:1rem 1.2rem; margin:.6rem 0 }
  /* Layer 1 — the one thing you should read first. */
  .light { display:flex; gap:.9rem; align-items:flex-start; padding:1.2rem;
           border-left:4px solid var(--mut) }
  .light.red    { border-left-color:var(--bad) }
  .light.amber  { border-left-color:var(--warn) }
  .light.green  { border-left-color:var(--ok) }
  .dot { font-size:1.6rem; line-height:1 }
  .q { color:var(--mut); font-size:.78rem; text-transform:uppercase;
       letter-spacing:.04em; margin-bottom:.15rem }
  .say { font-size:1.02rem; font-weight:600 }
  .count { font-size:2rem; font-weight:700; line-height:1 }
  .row { border-left:4px solid var(--ok); padding:.8rem 1rem; margin:.5rem 0;
         background:var(--card); border-radius:0 8px 8px 0 }
  .row.amber { border-left-color:var(--warn) }
  .row .head { font-weight:600 }
  .row .why { color:var(--mut); margin-top:.2rem }
  .mut{color:var(--mut)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  .ok{color:var(--ok)}
  .fine { font-size:.85rem; color:var(--mut) }
  details { margin-top:1rem } summary { cursor:pointer; color:var(--mut);
    font-size:.85rem }
  table { width:100%; border-collapse:collapse; margin-top:.6rem;
          font-variant-numeric:tabular-nums; font-size:.85rem }
  th,td { text-align:left; padding:.3rem .5rem; border-bottom:1px solid var(--line) }
  th { color:var(--mut); font-weight:600; font-size:.75rem; text-transform:uppercase }
  #err { color:var(--bad) }
  /* per-market audit cards with distance-to-green bars */
  .mkt { border:1px solid var(--line); border-radius:8px; padding:.7rem .9rem;
         margin:.5rem 0; background:var(--card) }
  .mkt .name { font-weight:600; font-variant-numeric:tabular-nums }
  .lights { display:flex; gap:1rem; flex-wrap:wrap; margin:.15rem 0 .5rem;
            font-size:.82rem }
  .bars { display:grid; grid-template-columns:auto 130px auto; gap:.15rem .6rem;
          align-items:center; font-size:.8rem; color:var(--mut) }
  .bar { height:.55rem; border-radius:4px; background:var(--line);
         overflow:hidden }
  .bar > i { display:block; height:100%; border-radius:4px; background:var(--mut) }
  .bar.ok > i { background:var(--ok) }
  .bar.warn > i { background:var(--warn) }
  .recon { font-size:.8rem; color:var(--mut); margin-top:.4rem }
  .tradeline { font-size:.82rem; margin-top:.3rem }
</style>
</head>
<body>
<main>
  <h1>Decision Intelligence Platform</h1>
  <p class="principle">Never makes predictions. Only consumes them.</p>
  <p id="err"></p>

  <!-- Layer 1 -->
  <h2>1 &middot; Can I trust this system yet?</h2>
  <div class="card light" id="light">
    <div class="dot" id="dot">&#9899;</div>
    <div><div class="say" id="headline">loading&hellip;</div>
         <div class="fine" id="trusted"></div></div>
  </div>

  <!-- Layer 2 -->
  <h2>2 &middot; Is anything worth buying today?</h2>
  <div class="card"><div class="count" id="count">&mdash;</div>
    <div class="fine" id="countsub"></div></div>
  <div id="rows"></div>

  <!-- Layer 3 -->
  <h2>3 &middot; What, where, how much?</h2>
  <div id="slips"><div class="card mut" id="noslips">&mdash;</div></div>

  <details>
    <summary>Set aside, and why</summary>
    <table id="sidelined"><thead><tr><th>market</th><th>graded</th>
      <th>why it is not shown</th></tr></thead><tbody></tbody></table>
    <div id="markets"></div>
    <p class="fine" id="thresholds"></p>
  </details>

<script>
const $ = (s) => document.querySelector(s);
const esc = (x) => String(x ?? "—").replace(/[&<>]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const DOT = {red:"🔴", amber:"🟡", green:"🟢"};
const pct = (x) => x == null ? "—" : (x*100).toFixed(1) + "%";

async function load() {
  let d;
  try { const r = await fetch("/decision");
        if (!r.ok) throw new Error(`/decision: ${r.status}`);
        d = await r.json(); }
  catch (e) { $("#err").textContent = e.message; return; }

  // ---- Layer 1
  const L1 = d.layer1;
  $("#light").className = "card light " + L1.light;
  $("#dot").textContent = DOT[L1.light] ?? "⚪";
  $("#headline").textContent = L1.headline;
  $("#trusted").textContent = L1.total
    ? `${L1.trusted} of ${L1.total} markets cleared for real money.` : "";

  // ---- Layer 2. A count first, because the answer is usually zero and a
  // number is read faster than an empty table is scanned.
  const L2 = d.layer2, green = L2.green ?? [], amber = L2.amber ?? [];
  $("#count").textContent = green.length;
  $("#count").className = "count " + (green.length ? "ok" : "mut");

  if (L2.blocked && L2.blocked.length) {
    // Distinct from a quiet market, and deliberately loud: this is a data
    // contract failure, not an absence of opportunity.
    $("#countsub").innerHTML = `<span class="bad">Cannot answer.</span> ` +
      L2.blocked.map(esc).join(" ");
  } else if (!green.length && !amber.length) {
    $("#countsub").textContent = L2.message ?? "";
  } else {
    $("#countsub").textContent =
      `${amber.length} forming, shown as paper.`;
  }

  const rows = green.concat(amber);
  $("#rows").innerHTML = rows.map(o => `
    <div class="row ${o.tone === "green" ? "" : "amber"}">
      <div class="head">${DOT[o.tone]} ${esc(o.subject)} &middot; ${esc(o.market)}</div>
      <div class="why">${esc(o.why)}</div>
    </div>`).join("");

  // ---- Layer 3
  $("#slips").innerHTML = rows.length ? rows.map(o => `
    <div class="card">
      <div class="head"><b>${esc(o.subject)}</b> &middot; ${esc(o.market)}</div>
      <div class="fine">Venue ${esc(o.source)} asks
        ${(o.price*100).toFixed(0)}&cent; &middot;
        our fair ${(o.fair*100).toFixed(0)}&cent; &middot;
        edge ${(o.edge*100).toFixed(1)}&cent;</div>
      <div class="fine">Stake: <b>${esc(o.stake)}</b></div>
    </div>`).join("")
    : `<div class="card mut">Nothing to stake. ${
         L1.light === "green" ? "" :
         "Real money stays locked until the light goes green."}</div>`;

  // ---- the audit trail, folded away
  $("#sidelined tbody").innerHTML = (L1.sidelined ?? []).map(s =>
    `<tr><td>${esc(s.market)}</td><td>${esc(s.n)}</td>
         <td class="mut">${esc(s.why)}</td></tr>`).join("")
    || `<tr><td colspan="3" class="mut">none</td></tr>`;

  // A distance-to-green bar: fill = current/threshold, green once it clears.
  const bar = (cur, thr) => {
    if (cur == null || thr == null || thr === 0)
      return `<span class="bar"><i style="width:0"></i></span>`;
    const f = Math.max(0, Math.min(1, cur / thr));
    const cls = f >= 1 ? "ok" : f >= 0.66 ? "warn" : "";
    return `<span class="bar ${cls}"><i style="width:${(f*100).toFixed(0)}%"></i></span>`;
  };
  const num = (x, d=0) => x == null ? "—" : Number(x).toFixed(d);

  $("#markets").innerHTML = Object.entries(L1.markets ?? {}).map(([k,m]) => {
    const dist = m.distance ?? {};
    const g = dist.graded ?? [m.n, null], rt = dist.rate ?? [m.realized, m.breakeven];
    const effLabel = (m.effective_n != null && m.effective_n < m.n)
      ? `${num(m.effective_n,0)} eff / ${g[1]}` : `${num(g[0],0)} / ${g[1]}`;
    const tr = m.tradeable;
    const trLight = tr ? `${DOT[tr.light]} tradeable` : "";
    const recon = m.recon
      ? `<div class="recon">settlement bias: ${esc(m.recon.city)} `
        + `${m.recon.delta_max>=0?"+":""}${num(m.recon.delta_max,1)}° max `
        + `(mean ${m.recon.delta_mean>=0?"+":""}${num(m.recon.delta_mean,1)}°) `
        + `— reliability of the instrument, not the outcome</div>` : "";
    const tradeline = tr
      ? `<div class="tradeline">${DOT[tr.light]} <b>tradeable:</b> ${esc(tr.headline)}</div>`
      : "";
    return `<div class="mkt">
      <div class="name">${esc(k)}</div>
      <div class="lights">
        <span>${DOT[m.light]} <b>trustable</b> — track record</span>
        ${tr ? `<span>${trLight} — harvestable edge</span>` : ""}
      </div>
      <div class="bars">
        <span>graded (de-clustered)</span>${bar(g[0], g[1])}<span>${effLabel}</span>
        <span>hit rate vs breakeven</span>${bar(rt[0], rt[1])}<span>${pct(rt[0])} / ${pct(rt[1])}</span>
      </div>
      ${tradeline}${recon}
    </div>`;
  }).join("") || `<div class="mut fine">no market has its own light yet</div>`;

  const t = d.thresholds;
  $("#thresholds").textContent =
    `A row goes green at edge ≥ ${(t.min_edge*100).toFixed(0)}¢, ` +
    `quality ≥ ${t.min_quality}, coverage ≥ ${(t.min_coverage*100).toFixed(0)}%, ` +
    `and only from a market with ≥ ${t.min_graded} graded outcomes clearing its breakeven.`;
}
load();
</script>
</main>
</body>
</html>
